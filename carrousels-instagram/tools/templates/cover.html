<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./_base.css" />
</head>
<body>
  <section class="slide slide--{{surface}} slide--cover">
    <div class="deco-arc deco-arc--tr"></div>
    <div class="deco-dots deco-dots--bl"></div>

    <div class="content content--cover">
      {{#eyebrow}}<div class="eyebrow">{{eyebrow}}</div>{{/eyebrow}}
      <h1 class="title title--{{titleSize}}">{{{title}}}</h1>
      {{#subtitle}}<p class="subtitle subtitle--cover">{{{subtitle}}}</p>{{/subtitle}}
    </div>

    <span class="swipe-cta">
      <span>Swipe</span>
      <span class="chevrons">
        <span class="chevron">›</span>
        <span class="chevron">›</span>
        <span class="chevron">›</span>
      </span>
    </span>

    <div class="footer-bar">
      <span class="footer-brand">Kind Dog Training</span>
      <span class="footer-count">01 / {{totalSlides}}</span>
    </div>
  </section>
</body>
</html>
